name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate config + codegen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ESPHome
        run: pip install esphome
      # The full SG5 example uses local secrets. CI supplies placeholders so
      # its real sleep policy and dashboard-facing entities are schema-checked.
      - name: Create placeholder secrets
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: "ci-ssid"
          wifi_password: "ci-password"
          api_key_sg5: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          ota_password_sg5: "ci-ota-password"
          wg_private_key_sg5: "AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA="
          wg_peer_endpoint_sg5: "vpn.example.test"
          wg_peer_public_key_sg5: "ci-public-key"
          EOF
      - name: Copy placeholder secrets beside SG5 config
        run: cp secrets.yaml examples/
      - name: Validate full SG5 example
        run: esphome config examples/subaru-sg5.yaml
      # Runs the component's Python codegen (to_code), so it catches schema /
      # codegen regressions without a full toolchain download.
      - name: Validate minimal component config
        run: esphome config tests/test-minimal.yaml

  compile:
    name: Compile (ESP32-C3, esp-idf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache PlatformIO + pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('tests/test-minimal.yaml') }}
          restore-keys: pio-${{ runner.os }}-
      - name: Install ESPHome
        run: pip install esphome
      # The real C++ build. This is what catches the AUTO_LOAD / include bugs
      # that `esphome config` alone cannot see.
      - name: esphome compile
        run: esphome compile tests/test-minimal.yaml
